[project]
name = "tops-2.0-backend"
version = "0.1.0"
description = "FastAPI backend for TOPS 2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-multipart>=0.0.22",
    "pydantic>=2.12.5",
    "pythonnet>=3.0.5",
    "PyVISA>=1.16.1",
    "numpy>=2.4.2",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.14",
    "mypy>=1.19.1",
    "scipy-stubs>=1.17.0.2"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "myenv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (catches likely bugs)
    "UP",  # pyupgrade (modernize Python syntax)
    "C4",  # flake8-comprehensions (better list/dict comprehensions)
    "SIM", # flake8-simplify (simplify code)
    "N",   # pep8-naming (enforce naming conventions)
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/core/stage.py" = ["E402", "F403", "F405"]  # pythonnet requires DLL loading before imports
"app/core/anisotropic_analysis.py" = ["N806", "N803"]  # Scientific variables use specific capitalization
"app/core/fdpbd/thermal_model.py" = ["N806"]  # Scientific variables use specific capitalization
"app/models/models.py" = ["N815"]  # Pydantic field names match API contract
"app/routers/endpoints.py" = ["B008"]  # FastAPI uses File(...)/Form(...) as defaults by design

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
mypy_path = "$MYPY_CONFIG_FILE_DIR"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Ignore missing imports for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "pythonnet",
    "clr_loader",
    "rich_toolkit",
]
ignore_missing_imports = true
